name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Dependency-free: compile everything, verify cross-module imports, validate
    # docker-compose.yml. Catches merge regressions where one module is replaced
    # by an older version whose neighbours still import the old names.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the mariadb connector builds against MariaDB Connector/C
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmariadb-dev gcc
      - run: python -m pip install -r server/requirements.txt pytest
      - run: python -m pytest tests -q
