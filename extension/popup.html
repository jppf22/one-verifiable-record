<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; padding: 12px; }
    label { display: block; margin-top: 8px; font-weight: 600; }
    input[type="text"] { width: 100%; margin-top: 2px; padding: 5px 7px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    button { padding: 5px 12px; }
    #status { margin-left: 8px; color: #137333; }
  </style>
</head>
<body>
  <b>One Verifiable Record</b>
  <label>API base URL
    <input type="text" id="apiBase">
  </label>
  <label>Web merge view URL
    <input type="text" id="webBase">
  </label>
  <div class="row">
    <label style="margin:0">
      <input type="checkbox" id="enabled"> Badge enabled
    </label>
    <span>
      <button id="save">Save</button><span id="status"></span>
    </span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
