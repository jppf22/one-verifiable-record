<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; padding: 12px; }
    label { display: block; margin-top: 8px; font-weight: 600; }
    input[type="text"] { width: 100%; margin-top: 2px; padding: 5px 7px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    button { padding: 5px 12px; }
    #status { margin-left: 8px; color: #137333; }
    #status.error { color: #b32424; display: block; margin: 8px 0 0; }
    .note { color: #54595d; line-height: 1.4; margin: 10px 0 0; }
  </style>
</head>
<body>
  <b>One Verifiable Record</b>
  <label>API base URL
    <input type="text" id="apiBase">
  </label>
  <label>Web app URL (comparison view)
    <input type="text" id="webBase">
  </label>
  <div class="row">
    <label style="margin:0">
      <input type="checkbox" id="enabled"> Badge enabled
    </label>
    <button id="save">Save</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="note">The badge appears only on tracked fi, sv and en article pages. Findings refer to the imported source revision.</p>
  <script src="popup.js"></script>
</body>
</html>
