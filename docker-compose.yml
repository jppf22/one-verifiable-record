services:
  mariadb:
    image: mariadb:11.8
    container_name: ovr-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ovr_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wikipedia}
      MARIADB_USER: ${MARIADB_USER:-ovr}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ovr_pass}
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=${INNODB_BUFFER_POOL_SIZE:-2G}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/001_live_refresh.sql:/docker-entrypoint-initdb.d/02_live_refresh.sql:ro
      - ./db/migrations/002_open_claim_taxonomy.sql:/docker-entrypoint-initdb.d/03_open_claim_taxonomy.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    container_name: ovr-server
    environment:
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      DATABASE_USER: ${MARIADB_USER:-ovr}
      DATABASE_PASSWORD: ${MARIADB_PASSWORD:-ovr_pass}
      DATABASE_NAME: ${MARIADB_DATABASE:-wikipedia}
      # AI inference: any OpenAI-compatible /v1 endpoint, local or hosted.
      # Local model via the ollama profile below: LLM_BASE_URL=http://ollama:11434/v1
      # Local model on the host (vLLM/LM Studio/llama.cpp): http://host.docker.internal:...
      # Hosted API key: e.g. https://api.openai.com/v1 or https://openrouter.ai/api/v1
      # Leave LLM_BASE_URL/LLM_MODEL empty to run LLM-free (deterministic verdicts only).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # Embeddings: any OpenAI-compatible /v1/embeddings endpoint.
      # Default: the local embedder service below. Local GPU worker: the "gpu"
      # profile (embedder-gpu) with EMBED_BASE_URL=http://embedder-gpu:8002/v1.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embedder:8001/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
    extra_hosts:
      # lets LLM_BASE_URL/EMBED_BASE_URL point at servers running on the host
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  embedder:
    # Local CPU embedding service (OpenAI-compatible /v1/embeddings).
    build: ./embedder
    container_name: ovr-embedder
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      # When EMBED_API_KEY is set, the service requires it as a bearer token and
      # the server sends it automatically.
      EMBED_API_TOKEN: ${EMBED_API_KEY:-}
      OMP_NUM_THREADS: ${EMBED_THREADS:-3}
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  # Optional local GPU embedding worker (replaces the embedder service as the
  # EMBED_BASE_URL target):
  #   EMBED_API_KEY=<token> docker compose --profile gpu up -d embedder-gpu
  #   EMBED_BASE_URL=http://embedder-gpu:8002/v1
  # Requires the NVIDIA container toolkit on the host.
  embedder-gpu:
    profiles: ["gpu"]
    build:
      context: ./embedder
      dockerfile: Dockerfile.gpu
    container_name: ovr-embedder-gpu
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_API_TOKEN: ${EMBED_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8002:8001"
    restart: unless-stopped

  # Optional local LLM (chat completions) for all AI inference:
  #   docker compose --profile local-llm up -d ollama
  #   docker compose exec ollama ollama pull <model>
  #   LLM_BASE_URL=http://ollama:11434/v1  LLM_MODEL=<model>
  # Any other OpenAI-compatible server (vLLM, LM Studio, llama.cpp on the host,
  # or a hosted API key) works the same through LLM_BASE_URL.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    container_name: ovr-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  web:
    build: ./web
    container_name: ovr-web
    depends_on:
      - server
    ports:
      # Keep the default private. Set OVR_PUBLIC_BIND=0.0.0.0 to publish the
      # web app and its same-origin /api proxy; the API port itself stays private.
      - "${OVR_PUBLIC_BIND:-127.0.0.1}:8080:80"
    restart: unless-stopped

volumes:
  mariadb_data:
  ollama_data:
