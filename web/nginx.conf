server {
    listen 80;
    server_name _;

    # Docker's DNS: re-resolve "server" so recreating the API container doesn't
    # leave nginx proxying to a stale IP (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:8000;

    location /api/ {
        # with a variable, nginx passes the original URI (/api/...) unchanged
        proxy_pass $api_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
